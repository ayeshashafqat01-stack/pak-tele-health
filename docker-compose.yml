version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: pth-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: pth_root_pass
      MYSQL_DATABASE: pak_tele_health
      MYSQL_USER: pth_app
      MYSQL_PASSWORD: pth_dev_pass
      TZ: UTC
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    ports:
      - "3306:3306"
    volumes:
      - pth_mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppth_root_pass"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-test:
    image: mysql:8.0
    container_name: pth-mysql-test
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: pth_test_root
      MYSQL_DATABASE: pak_tele_health_test
      MYSQL_USER: pth_test
      MYSQL_PASSWORD: pth_test_pass
      TZ: UTC
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    ports:
      - "3307:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppth_test_root"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pth_mysql_data:
