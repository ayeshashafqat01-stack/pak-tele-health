services:
  postgres:
    image: postgres:17-alpine
    container_name: pth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pak_tele_health
      POSTGRES_USER: pth_app
      POSTGRES_PASSWORD: pth_dev_pass
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pth_app -d pak_tele_health"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:17-alpine
    container_name: pth-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: pak_tele_health_test
      POSTGRES_USER: pth_test
      POSTGRES_PASSWORD: pth_test_pass
      TZ: UTC
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pth_test -d pak_tele_health_test"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pth_postgres_data:
